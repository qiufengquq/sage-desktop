[package]
name = "sage"
version = "1.0.1"
description = "Sage - 英语智能学习平台桌面端"
authors = ["Sage"]
edition = "2021"
# ai-core 要求 1.85；客户端跟随上游下限，避免"依赖能编译但宿主不允许"的隐性不一致
rust-version = "1.85"

[lib]
name = "sage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地数据库：bundled 让 SQLite 随二进制编译，用户机器无需安装任何东西
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# SAGE Intelligence：已合并为本仓库的 workspace 成员（原 sage-intelligence 仓库，
# commit 33be312c）。改动 crates/ 下的代码会立即反映到这里，不再需要升级 rev。
# 说明见 docs/AI_INTEGRATION.md §版本。
ai-core = { path = "../crates/ai-core" }
ai-core-tauri = { path = "../crates/ai-core-tauri" }
