[package]
name = "sage"
version = "0.1.0"
description = "Sage - 英语智能学习平台桌面端"
authors = ["Sage"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地数据库：bundled 让 SQLite 随二进制编译，用户机器无需安装任何东西
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
